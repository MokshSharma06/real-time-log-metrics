# ================================
# Application Configuration
# ================================

app:
  name: real-time-log-streaming
  environment: local        # local | azure
  timezone: UTC


# ================================
# Kafka Configuration
# ================================

kafka:
  bootstrap_servers: localhost:9092
  topic: app-logs
  starting_offsets: latest   # earliest | latest
  fail_on_data_loss: false   # important for streaming stability


# ================================
# Streaming Configuration
# ================================

streaming:
  trigger_interval: "10 seconds"

  event_time_column: event_time
  watermark_duration: "2 minutes"

  window:
    type: tumbling            # tumbling | sliding
    duration: "1 minute"
    slide: null               # used only if sliding


# ================================
# Deduplication Configuration
# ================================

deduplication:
  enabled: true
  key_columns:
    - event_id
  retention: "5 minutes"


# ================================
# Medallion Storage Paths
# ================================

paths:
  bronze: data/bronze
  silver: data/silver
  gold: data/gold

  checkpoints:
    bronze: checkpoints/bronze
    silver: checkpoints/silver
    gold: checkpoints/gold

